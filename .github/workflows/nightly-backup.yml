# Nightly encrypted database backup to Backblaze B2.
#
# Runs every night at 01:00 UTC (04:00 in Kampala) and can also be started by hand:
#   GitHub -> Actions -> "Nightly backup" -> Run workflow.
#
# It needs six repository secrets (Settings -> Secrets and variables -> Actions):
#   MONGO_URI, BACKUP_PASSPHRASE, B2_ENDPOINT, B2_KEY_ID, B2_APP_KEY, B2_BUCKET
#
# If anything fails, the run turns red and GitHub emails you.

name: Nightly backup

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two backups at the same time.
concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      BACKUP_KEEP_DAYS: "30"
    steps:
      - name: Check that all six secrets are set
        # Without Backblaze the script would only save the file on this temporary
        # machine and still say "finished" - so stop here instead.
        run: |
          missing=""
          for name in MONGO_URI BACKUP_PASSPHRASE B2_ENDPOINT B2_KEY_ID B2_APP_KEY B2_BUCKET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Back up the database to Backblaze B2
        run: npm run backup

      - name: Prove the newest backup can be opened
        # Downloads the newest file from B2 and decrypts it with the passphrase.
        # Preview only: nothing is restored or written anywhere.
        run: node restore.js latest

      - name: List the backups that are kept
        run: npm run backup:list